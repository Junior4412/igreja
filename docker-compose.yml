services:
  postgres:
    image: postgres:15-alpine
    container_name: ecclesia-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecclesia_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: ecclesia-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
